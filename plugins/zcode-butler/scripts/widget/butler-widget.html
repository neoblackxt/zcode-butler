<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 侧边栏插件 · 1:1 复刻原型</title>
<style>
  /* ─── tokens(取自参考图逐点取样)────────────────────────────── */
  :root {
    --panel:        #030303;   /* 面板 / 气泡黑 */
    --ring-track:   #2e2e2e;   /* 圆环轨道 */
    --arc-claude:   #ce6a47;   /* Claude 橙 */
    --arc-openai:   #7fdca9;   /* OpenAI 绿 */
    --arc-perplexity: #eef67e; /* Perplexity 黄 */
    /* 四环水位色(v0.6.3 用户定档):<30 绿 / 30–60 黄 / 60–90 橙 / ≥90 红
       (绿黄红沿用面板色系值,橙取 zc-c5 同值;无数据回灰 --label) */
    --ring-ok:   #7fdca9;
    --ring-warn: #eef67e;
    --ring-mid:  #ff8a30;
    --ring-low:  #ee5c5c;
    --badge:      #e25c4a;   /* 提醒徽标红(活动提醒提案 C/D 同源) */
    --ink:        #030303;   /* 亮底之上的墨色文字(通知卡主按钮) */
    --icon:         #f5f5f5;   /* 图标白 */
    --label:        #e2e2e2;   /* 百分比文字 */
    --gear:         #ececec;   /* 齿轮白 */

    /* 壁纸渐变色标(模糊紫粉壁纸) */
    --wall-base:    #a9a29e;
    --wall-pink-tl: #bc939b;
    --wall-lilac:   #be9bc3;
    --wall-peri:    #9fa0da;
    --wall-pink-l:  #c798a4;
    --wall-salmon:  #b08676;
    --wall-mauve:   #bba1a3;
    --wall-gray-b:  #aba3a1;
    --wall-gray-br: #b0acad;

    --font-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system,
               'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: transparent;   /* 悬浮窗:面板外月牙空隙透出桌面(WebView2 透明) */
    font-family: var(--font-ui);
    overflow: hidden;
  }

  .viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* ─── 手机舞台:逻辑坐标 = 参考图像素,底部加长容纳第四环(430 × 2025)──
     悬浮窗模式:贴窗口右缘(fit 按窗口高等比缩放);壁纸移除,由面板黑与空隙透出构成 ── */
  .stage {
    position: absolute;
    right: 0; top: 0;
    transform-origin: 100% 0;
    width: 430px;
    height: 2025px;
    flex: none;
    overflow: hidden;
    background: transparent;
  }

  /* ─── 展开态:贴边面板(形状由实测轮廓点平滑生成)──────────────
     展开(入):expo-out 起步快、丝滑减速停稳;收起(出):ease-in-cubic
     加速滑出右缘,像被顺势收走(动效取自设计原型,v0.5.0 正式入库)。
     纯水平位移 → 形状掩码 Y 量程不变(宿主 1/3 锚定只读 Y,零跳动),
     X 掩码滑出窗外 → 自动点击穿透,宿主 ps1 零改动 */
  .panel-wrap {
    position: absolute; inset: 0;
    transition: transform 0.62s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
  }
  .stage.minimized .panel-wrap {
    transform: translateX(106%);
    transition: transform 0.42s cubic-bezier(0.55, 0.055, 0.675, 0.19);
  }

  .panel-svg { position: absolute; inset: 0; display: block; }

  /* ─── 圆环计量组 ─────────────────────────────────────────────── */
  .meter {
    position: absolute;
    left: 265.5px;              /* 环外沿左缘 = 333 - 67.5 */
    width: 135px; height: 135px;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.45s ease-out;
  }
  /* 展开时四环自顶部错峰归位(设计原型同款,第四环顺延 0.32s) */
  .panel-wrap .meter:nth-of-type(1) { transition-delay: 0.08s; }
  .panel-wrap .meter:nth-of-type(2) { transition-delay: 0.16s; }
  .panel-wrap .meter:nth-of-type(3) { transition-delay: 0.24s; }
  .panel-wrap .meter:nth-of-type(4) { transition-delay: 0.32s; }
  /* 收起:四环无延迟,右漂 + 淡出,随面板顺势收走 */
  .stage.minimized .panel-wrap .meter {
    transform: translateX(52px);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.55, 0.055, 0.675, 0.19),
                opacity 0.24s ease-in;
    transition-delay: 0s;
  }
  .meter svg.ring { position: absolute; inset: 0; }
  .meter .ring-track { stroke: var(--ring-track); }
  .meter .ring-arc   { stroke-linecap: round; }
  .glyph {
    position: absolute;
    left: 50%; top: 50%;
    translate: -50% -50%;
    color: var(--icon);
    line-height: 1;
    font-weight: 600;
    letter-spacing: 0.01em;
    user-select: none;
  }
  .meter .glyph { font-size: 42px; }

  .meter .pct {
    position: absolute;
    top: 167px; left: -30px; right: -30px;
    text-align: center;
    font-size: 44px;
    line-height: 44px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--label);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  /* ─── 高峰期光晕:工作日 14:00–18:00 围绕 5h 环的橙色辉光 ─────────
     环带渐变峰值对准圆环轨道(r61/光晕半径105 ≈ 58%),呼吸脉动 2.6s */
  .peak-halo {
    position: absolute;
    left: 50%; top: 50%;
    width: 210px; height: 210px;
    translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(224, 116, 66, 0)    0%,
      rgba(224, 116, 66, 0)    48%,
      rgba(224, 116, 66, 0.62) 58%,
      rgba(224, 116, 66, 0.28) 67%,
      rgba(224, 116, 66, 0)    78%);
    filter: blur(6px);
    opacity: 0;
    transition: opacity 0.9s ease;
    pointer-events: none;
  }
  body.peak-live .peak-halo {
    opacity: 1;
    animation: peak-pulse 2.6s ease-in-out infinite;
  }
  body.peak-live .meter-5h .ring {
    filter: drop-shadow(0 0 9px rgba(224, 116, 66, 0.5));
  }
  @keyframes peak-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* ─── 悬停判定区:与按钮同心的圆,仅弧形按钮自身范围触发过渡 ───── */
  .fab-zone {
    position: absolute;
    left: 233px; top: 1591px;     /* 圆心 = 弧线/气泡同心圆心 (317,1675),r 84 */
    width: 168px; height: 168px;
    border-radius: 50%;
    z-index: 4;
  }

  /* ─── 悬浮设置钮:默认 = 细弧线(参考图实测迁移),悬停 = 齿轮气泡 ──
      弧线与气泡同心;悬停时弧线顺势收进气泡绽开 */
  .fab {
    position: absolute;
    left: -12.5px; top: -13px;     /* 相对判定区 = 舞台 (220.5,1578),SVG 圆心 (96.5,97) */
    width: 193px; height: 193px;
  }
  .fab svg {
    position: absolute; inset: 0;
    display: block; overflow: visible;
  }
  .fab .disc {
    opacity: 0;
    transform: scale(0.55);
    transform-origin: 96.5px 97px;
    transition: transform 0.34s cubic-bezier(0.55, 0.055, 0.675, 0.19),
                opacity 0.26s ease-in;
  }
  .fab .arc {
    fill: none;
    stroke: var(--panel);
    stroke-width: 22.3;
    stroke-linecap: round;
    opacity: 1;
    transform: rotate(0deg) scale(1);
    transform-origin: 96.5px 97px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.24s ease-out;
  }
  /* 悬停 / 键盘聚焦:弧线顺势收走,气泡以 expo-out 绽开 */
  .fab-zone:hover .disc,
  .fab-zone:focus-within .disc {
    opacity: 1;
    transform: scale(1);
    transition: transform 0.44s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.28s ease-out;
  }
  .fab-zone:hover .arc,
  .fab-zone:focus-within .arc {
    opacity: 0;
    transform: rotate(-48deg) scale(0.72);
    transition: transform 0.26s cubic-bezier(0.55, 0.055, 0.675, 0.19),
                opacity 0.2s ease-in;
  }
  .fab .gear-g {
    transform-origin: 96.5px 97px;
    transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.2s ease;
  }
  .gear-body {
    fill: none;
    stroke: var(--gear);
    stroke-width: 8;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .fab-hit {
    position: absolute;
    left: 20px; top: 20.5px;
    width: 153px; height: 153px;
    border: 0; padding: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .fab-hit:focus-visible {
    outline: 2px solid rgba(3, 3, 3, 0.75);
    outline-offset: 3px;
  }

  /* ─── 收起态:按钮常驻「眼镜」气泡(活动提醒提案 C)──────────────
     面板隐藏时弧线不再示人:弧线顺势收走(rotate −48° 缩退),黑气泡
     expo-out 绽开常驻,白色镜片圆环居中;有未读时红色徽标弹簧落上
     (过冲回弹,提案 C「先绽开再弹徽标」节奏)。悬停仅轻微放大,
     眼镜即按钮;齿轮只在展开态悬停出现(设置入口走展开态)。 */
  .stage.minimized .fab .disc {
    opacity: 1;
    transform: scale(1);
    transition: transform 0.44s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.28s ease-out;
  }
  .stage.minimized .fab .arc {
    opacity: 0;
    transform: rotate(-48deg) scale(0.72);
  }
  .stage.minimized .fab-zone:hover .disc,
  .stage.minimized .fab-zone:focus-within .disc {
    transform: scale(1.045);
  }
  .fab .eye-g {
    opacity: 0;
    transform: scale(0.7);
    transform-origin: 96.5px 97px;
    transition: opacity 0.2s ease,
                transform 0.26s cubic-bezier(0.55, 0.055, 0.675, 0.19);
  }
  .stage.minimized .fab .eye-g {
    opacity: 1;
    transform: scale(1);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.12s,
                opacity 0.24s ease-out 0.12s;
  }
  .stage.minimized .fab .gear-g {
    opacity: 0;   /* 退场(transform 被点击旋转的内联样式占用,仅淡出) */
  }
  .fab .badge-g {
    opacity: 0;
    transform: scale(0);
    transform-origin: 140.6px 44px;
    transition: transform 0.3s cubic-bezier(0.55, 0.055, 0.675, 0.19),
                opacity 0.18s ease-in;
  }
  .stage.minimized .fab.has-msg .badge-g {
    opacity: 1;
    transform: scale(1);
    transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s,
                opacity 0.2s ease-out 0.3s;
  }

  /* ─── 提醒通知卡(活动提醒提案 D):有未读时点眼镜弹出,覆盖眼镜 ──
     样式 1:1 迁自提案 D:几何按 fab 直径比例 ×1.471 折算为舞台像素
     (提案卡宽 212 / 盘 104 ↔ 舞台 312 / 153),文字再 ×1.25 保证整窗
     等比缩小后的可读性(沿用 v0.4.8 弹框放大先例);
     右缘锚定 425、垂直居中于 fab 圆心 (317,1675);入场自右滑入
     24.5%(提案 52/212),「知道了/稍后」后渐进滑出收回。 */
  .toast {
    position: absolute;
    left: 425px; top: 1675px;
    width: 312px;
    z-index: 5;
    background: #0a0a0a;
    border: 1.5px solid var(--track);
    border-radius: 24px;
    padding: 24px 26px 22px;
    box-shadow: 0 26px 60px rgba(3, 3, 3, 0.35);
    opacity: 0;
    transform: translate(-100%, -50%) translateX(24.5%);
    transition: transform 0.42s cubic-bezier(0.55, 0.055, 0.675, 0.19),
                opacity 0.26s ease-in;
    pointer-events: none;
  }
  .toast.on {
    opacity: 1;
    transform: translate(-100%, -50%) translateX(0);
    transition: transform 0.48s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.3s ease-out;
    pointer-events: auto;
  }
  .toast .t {
    font-size: 24px;
    font-weight: 700;
    color: var(--icon);
    margin-bottom: 8px;
    letter-spacing: 0.01em;
  }
  .toast .b {
    font-size: 22.5px;
    line-height: 1.5;
    color: #c9c9c9;
    margin-bottom: 20px;
  }
  .toast .row { display: flex; gap: 12px; align-items: center; }
  .toast button {
    font-family: inherit;
    border: 0;
    padding: 10px 22px;
    font-size: 21px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
  }
  .toast .primary { background: var(--icon); color: var(--ink); }
  .toast .primary:hover { opacity: 0.86; }
  .toast .ghost { color: var(--label); background: transparent; padding: 10px 16px; }
  .toast .ghost:hover { background: rgba(255, 255, 255, 0.07); }
  .toast button:focus-visible {
    outline: 2px solid rgba(245, 245, 245, 0.8);
    outline-offset: 2px;
  }

  /* ─── 环详情弹窗:悬停显示环时自左浮现,尖角指向该环中心 ───────
     气泡体 = 四角圆角矩形主体 + 右侧直边锐角尖角(单条 SVG path,投影随形);
     主体四角保留圆角,尖角两腰为直线、顶点尖锐无弧度;
     全部尺寸以舞台像素 × --u 计,与侧栏随窗口高等比缩放。
     几何:体宽 690 · 体高 700(v0.6.0 自 548 加高容纳四分发密集内容,尖角仍垂直居中) · 尖角长 84 · 尖角顶点距面板左缘 ≈54
     v0.4.8:弹框整体等比例放大 30% —— 派生单位 --pu = --u × --pop-scale,
     本块所有尺寸/字号/间距/投影改按 --pu 计(设计稿原值一律不动);
     气泡 path 的 viewBox 保持 780×700,由容器拉伸等比放大,无需重描坐标;
     右缘(尖角侧)位置不变,气泡整体向左展开,宿主窗口同步加宽(ps1 winW) */
  .usage-pop {
    --pop-scale: 1.3;                                   /* 弹框放大倍率:本块唯一真相源 */
    --pu: calc(var(--u, 0.5px) * var(--pop-scale, 1));  /* --u 由 JS 按窗高内联设置 */
    position: absolute;
    left: 0; top: 0;
    width: calc(var(--pu, 0.5px) * 780);
    height: calc(var(--pu, 0.5px) * var(--pop-h, 700));  /* --pop-h 由 fitPopHeight 按内容实测设置 */
    opacity: 0;
    transform: translateX(calc(var(--pu, 0.5px) * -14));
    transition: opacity 0.16s ease-out,
                transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 6;
    will-change: opacity, transform;
  }
  .usage-pop.on {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;   /* v0.6.2:刷新按钮可点(临时);形状上报随之并入弹窗矩形 */
  }
  .pop-bubble {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 calc(var(--pu, 0.5px) * 14) calc(var(--pu, 0.5px) * 44) rgba(0, 0, 0, 0.42));
  }
  .pop-body {
    position: absolute;
    left: 0; top: 0;
    width: calc(var(--pu, 0.5px) * 690);
    height: 100%;
    padding: calc(var(--pu, 0.5px) * 32) calc(var(--pu, 0.5px) * 36) calc(var(--pu, 0.5px) * 16);
    display: flex;
    flex-direction: column;
    overflow: hidden;   /* 内容超气泡即裁切(正常数据不应触底,验收量 scrollHeight) */
  }
  .pop-head {
    display: flex;
    align-items: center;
    gap: calc(var(--pu, 0.5px) * 12);
  }
  .pop-logo {
    width: calc(var(--pu, 0.5px) * 46);
    height: calc(var(--pu, 0.5px) * 46);
    flex: none;
  }
  .pop-logo svg { width: 100%; height: 100%; display: block; }
  .pop-title {
    margin: 0;
    font-size: calc(var(--pu, 0.5px) * 44);
    font-weight: 700;
    letter-spacing: 0.005em;
    color: #f7f7f7;
    white-space: nowrap;   /* 头部四件套超宽时禁折行(实测折行=第一行"跑"),宁缩字号 */
    flex: none;
  }
  /* v0.6.2 临时刷新按钮(zcode-watch WPF 卡片右上 ↻ 同款语义:点击即时拉新数) */
  .pop-refresh {
    margin-left: auto;
    align-self: center;
    border: 0;
    padding: calc(var(--pu, 0.5px) * 6) calc(var(--pu, 0.5px) * 14);
    background: transparent;
    color: #8d8d8d;
    font-size: calc(var(--pu, 0.5px) * 25);
    font-family: inherit;
    line-height: 1;
    cursor: pointer;
    border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .pop-refresh:hover { color: #f0f0f0; background: rgba(255, 255, 255, 0.06); }
  .pop-refresh:disabled { color: #565656; cursor: default; background: transparent; }
  .pop-refresh:focus-visible { outline: 2px solid rgba(245, 245, 245, 0.8); outline-offset: 2px; }
  /* 5h 头部拥挤(标志+长标题+徽标占满 618 内容宽),刷新收成图标腾位 */
  .pop-refresh.icon-only { padding: calc(var(--pu, 0.5px) * 6) calc(var(--pu, 0.5px) * 8); }
  /* v0.6.3:5h 头部 BigModel 徽标(ZCode 模型设置页同款胶囊:
     border-border + bg-surface + ui-xs,来源 packages/ui SettingsResourceGroup 族);
     内联趋势小图标 + 档位配额文案,色随文字 */
  .pop-qbadge {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--pu, 0.5px) * 5);
    border: 1px solid rgba(64, 153, 255, 0.30);
    border-radius: 999px;
    background: rgba(64, 153, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(64, 153, 255, 0.05);   /* 极淡蓝外圈(用户指定包裹) */
    padding: calc(var(--pu, 0.5px) * 3) calc(var(--pu, 0.5px) * 10);
    font-size: calc(var(--pu, 0.5px) * 22);
    font-weight: 500;
    line-height: 1.2;
    color: #c6d4ec;
    white-space: nowrap;
    align-self: center;
  }
  .pop-qbadge svg { width: calc(var(--pu, 0.5px) * 18); height: calc(var(--pu, 0.5px) * 18); flex: none; }
  .pop-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: calc(var(--pu, 0.5px) * 26);
  }
  .pop-row.first  { margin-top: calc(var(--pu, 0.5px) * 24); }
  .pop-row.tight  { margin-top: calc(var(--pu, 0.5px) * 6); }
  .pop-label {
    font-size: calc(var(--pu, 0.5px) * 31);
    font-weight: 600;
    letter-spacing: 0.005em;
    color: #f0f0f0;
  }
  .pop-sub {
    font-size: calc(var(--pu, 0.5px) * 27);
    color: #8d8d8d;
  }
  .pop-bar {
    height: calc(var(--pu, 0.5px) * 13);
    border-radius: calc(var(--pu, 0.5px) * 6.5);
    background: #3a3a3a;
    margin: calc(var(--pu, 0.5px) * 9) 0 calc(var(--pu, 0.5px) * 7);
    overflow: hidden;
  }
  .pop-bar i { display: block; height: 100%; border-radius: inherit; }
  .pop-used {
    font-size: calc(var(--pu, 0.5px) * 33);
    font-weight: 700;
    letter-spacing: 0.005em;
    color: #fafafa;
  }
  .pop-divider {
    height: calc(var(--pu, 0.5px) * 1.5);
    background: #262626;
    margin: calc(var(--pu, 0.5px) * 14) 0 calc(var(--pu, 0.5px) * 7);

    popHStage = Math.max(300, Math.min(700, Math.ceil(needCss / scale) + 6));

  }

  /* ── 5h 弹框内容:ZCode「使用统计」两页风格(v0.6.3 定稿,默认 V1;?v=1..5 可预览备选)。
     设计令牌逐值取自 zai-org/ZCode theme-zai-dark:额度卡(bigmodel 控制台排布)/
     摘要条/图例/图表色板,速查表在桌面《ZCode页面提取》。
     额度卡口径:数值=已使用 %、条形蓝色(≥80% 红)、重置时间当天只显 HH:mm ── */
  var pop5hVariant = (location.search.match(/[?&]v=([1-5])/) || [])[1] || '1';  /* 默认 V1(定稿);?v=2..5 预览其余方案 */
  function peakBannerRight(leftMin) {
    if (leftMin < 1) return '即将结束';
    if (leftMin >= 60) return '还剩 ' + Math.floor(leftMin / 60) + ' 小时 ' + (leftMin % 60) + ' 分';
    return '还剩 ' + leftMin + ' 分';
  }
  function fmtZCReset(ts) {
    var d = new Date(Number(ts) || 0), z = function (v) { return (v < 10 ? '0' : '') + v; };
    return d.getFullYear() + '/' + z(d.getMonth() + 1) + '/' + z(d.getDate())
      + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  var ZC_COLORS = ['var(--zc-c1)', 'var(--zc-c2)', 'var(--zc-c3)', 'var(--zc-c4)', 'var(--zc-c5)', 'var(--zc-c6)'];
  /* 头部「更新于 HH:mm:ss」:取数时间同源(5h/7d 共用,v0.6.7 抽出) */
  function whenTxtOf() {
    var zz = function (v) { return (v < 10 ? '0' : '') + v; };
    var ts = butlerData && butlerData.fetchedAt ? new Date(butlerData.fetchedAt) : new Date();
    return '更新于 ' + zz(ts.getHours()) + ':' + zz(ts.getMinutes()) + ':' + zz(ts.getSeconds());
  }
  function zvData(a) {
    var r = a.fiveHour;
    var rem = r ? Math.max(0, Math.min(100, 100 - r.pct)) : null;
    var lv = String(a.level || '').toUpperCase() || '未知';
    var du = a.dayUsage;
    var models = (a.modelsToday || []).map(function (m, i) {
      return { name: m.name, tokens: m.tokens, color: ZC_COLORS[i % ZC_COLORS.length] };
    });
    return {
      lv: lv,
      fh: r,
      tierTxt: lv + ' 套餐',
      whenTxt: whenTxtOf(),
      rem: rem,
      remPct: rem == null ? 0 : rem,

      resetTxt: r && r.resetAt > 0 ? fmtZCReset(r.resetAt) + ' 重置' : '重置时间未知',
      chip: peakState().inPeak

      du: du,
      dayTok: du ? fmtTok(du.total.tokens) : '--',
      dayCalls: du ? fmtCnt(du.total.calls) : '--',
      peakTok: du ? fmtTok(du.peak.tokens) : '--',
      offTok: du ? fmtTok(du.offPeak.tokens) : '--',
      models: models,
      modelsSum: models.reduce(function (t, m) { return t + m.tokens; }, 0),
    };
  }
  function zvLegend(d, withPct) {
    var h = '<div class="zv-leg zv-mt10">';
    d.models.forEach(function (m) {
      h += '<span class="it"><i class="zv-swatch" style="background:' + m.color + '"></i>'
        + '<span class="zv-sm zv-sub">' + esc(m.name) + '</span>'
        + '<span class="zv-sm mono">' + fmtTok(m.tokens)

  }
  /* 摘要三格条:cells 可选(5h 默认当日/高峰/非高峰;7d 传周口径三格,v0.6.7 参数化) */
  function zvStrip(d, cells) {
    cells = cells || [
      { v: d.dayTok, k: '当日 tokens' },

    cells.forEach(function (c, i) {
      if (i) h += '<div class="zv-div"></div>';

  function zvHead(d) {

  }
  /* 重置时间(bigmodel 控制台口径):当天只显 HH:mm,跨天显 YYYY-MM-DD HH:mm */
  function fmtBMReset(ts) {
    var d = new Date(Number(ts) || 0), n = new Date();
    var z = function (v) { return (v < 10 ? '0' : '') + v; };
    var sameDay = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    return sameDay
      ? z(d.getHours()) + ':' + z(d.getMinutes())
      : d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate())
        + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  /* 额度卡(bigmodel 控制台同款排布,用户参考图):标签+ⓘ → N% 已使用 → 细条(固定色,barColor 传入)→ 重置时间 */
  function quotaCardBM(label, r, barColor, chipHtml) {
    var pct = r ? Math.max(0, Math.min(100, r.pct)) : null;
    return '<div class="zv-card">'
      + '<div class="zv-row"><span class="zv-base zv-qlabel">' + label + BM_INFO_ICON + '</span>' + (chipHtml || '') + '</div>'
      + '<div class="zv-vrow zv-mt10"><span class="zv-xl">' + (pct == null ? '--' : Math.round(pct))
      + '%</span><span class="zv-sm zv-sub">已使用</span></div>'
      + '<div class="zv-track zv-mt10"><i style="width:' + (pct || 0) + '%;background:' + barColor + '"></i></div>'
      + '<div class="zv-sm zv-sub zv-mt10">重置时间：' + (r && r.resetAt > 0 ? fmtBMReset(r.resetAt) : '未知') + '</div>'
      + '</div>';
  }
  function zvQuotaCard(d) {
    return quotaCardBM('每5小时使用额度', d.fh, 'var(--zc-c1)', d.chip);   /* 5h 条恒蓝(zc-c1 #4099ff) */
  }

  /* 模型占比段(V1/V5 共用):标题行 + 堆叠条(图表色按占比分段);
     title/rightTok 可选——5h 默认「当日/列表和」,7d 传「近7天」与 weekUsage 真值(v0.6.7 参数化) */
  function zvShare(d, title, rightTok) {
    var seg = '';
    d.models.forEach(function (m) {
      var w = d.modelsSum > 0 ? Math.max(2, Math.round(m.tokens / d.modelsSum * 100)) : 0;
      seg += '<i style="width:' + w + '%;background:' + m.color + '"></i>';
    });
    return '<div class="zv-mt12"><div class="zv-row"><span class="zv-sm zv-sub">' + (title || '当日模型占比') + '</span>'
      + '<span class="zv-sm mono">' + fmtTok(rightTok != null ? rightTok : d.modelsSum) + '</span></div>'
      + '<div class="zv-stack zv-mt10">' + seg + '</div></div>';
  }

  var ZV_BUILDERS = {
    /* V1 额度卡 + 摘要条 + 当日模型占比(用户定稿编排:摘要条插在额度卡与占比之间) */
    1: function (d) {
      return '<div class="zv">' + zvHead(d) + '<div class="zv-mt12">' + zvQuotaCard(d) + '</div>'
        + zvStrip(d) + zvShare(d) + zvLegend(d, true) + '</div>';
    },
    /* V2 大数字 + 全宽轨道 + 摘要条(无卡开放排版,主色大字) */
    2: function (d) {
      return '<div class="zv">' + zvHead(d) + '<div class="zv-mt12">'
        + '<div class="zv-row"><span class="zv-sm zv-sub">5 小时 Prompt 池</span>'
        + '<span class="zv-sm zv-sub">' + d.resetTxt + '</span></div>'
        + '<div class="zv-row zv-mt6"><span class="zv-xl" style="color:var(--zc-c1)">' + d.remTxt
        + '</span><span class="zv-sm zv-sub">剩余</span>' + (d.chip ? '<span>' + d.chip + '</span>' : '') + '</div>'
        + '<div class="zv-track zv-mt10"><i style="width:' + Math.max(0, d.remPct) + '%;background:var(--zc-c1)"></i></div>'
        + zvStrip(d) + zvLegend(d) + '</div>';
    },
    /* V3 双卡:额度卡 + 当日活动卡(kv 行) */
    3: function (d) {
      return '<div class="zv">' + zvHead(d) + '<div class="zv-mt12">' + zvQuotaCard(d) + '</div>'
        + '<div class="zv-card zv-mt12">'
        + '<div class="zv-row"><span class="zv-base">当日</span>'
        + '<span class="zv-lg mono">' + d.dayTok + '</span></div>'
        + '<div class="zv-row zv-mt10"><span class="zv-sm zv-sub">高峰期(工作日 14–18 时)</span>'
        + '<span class="zv-sm mono">' + d.peakTok + '</span></div>'
        + '<div class="zv-row zv-mt6"><span class="zv-sm zv-sub">非高峰期</span>'
        + '<span class="zv-sm mono">' + d.offTok + '</span></div>'
        + '</div>'
        + zvLegend(d) + '</div>';
    },
    /* V4 三列大数字(开放排版,仅一条分隔线) */
    4: function (d) {
      return '<div class="zv">' + zvHead(d) + '<div class="zv-mt12">'
        + '<div class="zv-row"><span class="zv-base">5 小时 Prompt 池</span>'
        + '<span class="zv-base">' + (d.chip ? d.chip : d.remTxt) + '</span></div>'
        + '<div class="zv-track zv-mt10"><i style="width:' + Math.max(0, d.remPct) + '%;background:var(--zc-c1)"></i></div>'
        + '<div class="zv-row zv-mt6"><span class="zv-xs zv-sub">' + d.resetTxt + ' · 剩余 ' + d.remTxt + '</span></div>'
        + '<div style="height:1px;background:var(--zc-border);margin:' + 'calc(var(--pu,0.5px)*14)' + ' 0;"></div>'
        + '<div style="display:flex;gap:calc(var(--pu,0.5px)*12)">'
        + '<div style="flex:1;text-align:center"><div class="zv-lg">' + d.dayTok + '</div><div class="zv-sm zv-sub zv-mt6">当日</div></div>'
        + '<div style="flex:1;text-align:center"><div class="zv-lg">' + d.peakTok + '</div><div class="zv-sm zv-sub zv-mt6">高峰期</div></div>'
        + '<div style="flex:1;text-align:center"><div class="zv-lg">' + d.offTok + '</div><div class="zv-sm zv-sub zv-mt6">非高峰期</div></div>'
        + '</div>'

    5: function (d) {

        + zvShare(d)
        + zvLegend(d, true)
        + '<div class="zv-row zv-mt12"><span class="zv-sm zv-sub">当日 ' + d.dayTok
        + '</span><span class="zv-sm zv-sub">高峰 ' + d.peakTok + ' · 非高峰 ' + d.offTok + '</span></div>'
        + '</div>';
    },
  };

  function pop5hHtml(a) {
    var d = zvData(a);
    var build = ZV_BUILDERS[pop5hVariant] || ZV_BUILDERS[1];
    return build(d);
  }

  /* 7d 数据(v0.6.7):摘要三格 = 近7天 tokens / 日均 / 调用次数(weekUsage 合计真值);

     合计以 totalUsage 为准——十四轮周窗口定标);图例 N% 仍按列表和为分母(分布占比) */
  function zvWeekData(a) {
    var wu = a.weekUsage;

  /* 7d 弹框(v0.6.7 起 = 5h V1 同款排版,用户拍板):更新于 + 每周额度卡(条恒绿)+

  function pop7dHtml(a) {

  /* mcp 弹框:MCP 每月额度卡(bigmodel 排布)+ 联网搜索/网页读取/Zread 各自耗量(弧族配色) */
  function popMcpHtml(a) {

    var t = (a.mcpMonthly && a.mcpMonthly.tools) || {};
    var lim = a.mcpMonthly && a.mcpMonthly.limit > 0 ? a.mcpMonthly.limit : 0;
    h += toolRowHtml('联网搜索', t.webSearch, lim, 'var(--arc-openai)');

    return '<div class="pop-row tight"><span class="pop-label">' + name + '</span><span class="pop-val">'

      + '<div class="pop-bar slim"><i style="width:' + pct + '%;background:' + color + '"></i></div>';
  }

  /* key 弹框:全部 Key 卡(名称/尾号/档位/国内·海外 + 水位条 + 用量明细;
     智谱 Coding Plan 专用,provider bigmodel=国内 / zai=海外;
     v0.6.2 起口径 = 原始 token,用户拍板取消高峰 ×3 折算) */
  function popKeyHtml(keys) {
    var h = '';
    h += '<div class="pop-note lead">智谱 Coding Plan Key · 国内 / 海外 · 口径:原始 token(高峰不折算)</div>';
    if (!keys || !keys.length) {
      h += '<div class="pop-row tight"><span class="pop-label">未配置监控 Key</span>'
        + '<span class="pop-val sub">添加方式见 /butler:watch</span></div>';
      return h;
    }

    keys.slice(0, CAP).forEach(function (k) {
      h += '<div class="pop-key">';

        + '</span><span class="k-meta">' + (k.status === 'error' ? '查询失败'
        : '[' + esc(k.tier || '未知') + '] · ' + (k.provider === 'zai' ? '海外' : '国内')) + '</span></div>';
      if (k.status === 'error') {
        h += '<div class="pop-note err">' + esc(k.error || '查询失败') + '</div>';
      } else {
        h += barHtml(k.pct, ringColor(k.pct), true);
        h += '<div class="pop-note">' + fmtTok(k.used != null ? k.used : k.usedWeighted) + ' / ' + fmtTok(k.quota)

  /* 高峰进度条走表:5h 弹框常显时每 30s 刷新(倒计时/进度推进) */
  setInterval(function () {
    var p = document.getElementById('usagePop');
    if (p && p.classList.contains('on') && popKind === '5h') renderPop('5h');
  }, 30000);

  /* ── 临时刷新按钮(v0.6.2,zcode-watch ↻ 同款语义):点击 → 通知宿主立即重跑
     status.mjs;新数据到达(butlerApply)即复位。仅宿主环境生效;45s 兜底复位。
     临时件:待后续接「SessionStart/定时自动刷新」后整体移除(含 pop 矩形入掩码)。 */
  (function () {
    var btn = document.getElementById('popRefresh');
    if (!btn) return;
    var RESET = '↻ 刷新';
    function reset() {
      btn.disabled = false;
      btn.classList.toggle('icon-only', popKind === '5h');
      btn.textContent = popKind === '5h' ? '↻' : RESET;
    }
    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      if (!(window.chrome && window.chrome.webview)) { reset(); return; }
      btn.disabled = true;
      btn.textContent = '刷新中…';
      try { window.chrome.webview.postMessage('{"type":"refresh"}'); } catch (err) { reset(); return; }
      setTimeout(function () { if (btn.disabled) reset(); }, 45000);
    });
    window.butlerPopRefreshDone = reset;
  })();

  /* ── 环详情弹窗:悬停显示环 → 弹窗左侧浮现,尖角指向该环中心。
      尺寸/间距全部按舞台像素等比(--u = 窗口高 / 2025),外框再乘 CSS --pop-scale
      (v0.4.8 等比例放大 30%);尖角右缘锚点不变,气泡向左展开;
      ?pop=5h|7d|mcp|key 让对应弹窗常显,便于核对与截图(v0.6.0 起四分发) ── */
  var FORCE_POP_FOR_PREVIEW = false;   /* 渲染核验用,默认关闭 */
  (function () {
    var pop = document.getElementById('usagePop');
    if (!pop) return;
    var meters = Array.prototype.slice.call(document.querySelectorAll('.meter'));
    var TIP_TO_RIGHT = 265;        /* 舞台px:尖角顶点 → 窗口右缘(430 − 165) */
    /* 倍率唯一真相源 = CSS .usage-pop 的 --pop-scale;读不到回落 1
       (右缘锚点不变,弹框退回设计稿原尺寸,不会越出宿主窗口) */
    var POP_SCALE = parseFloat(getComputedStyle(pop).getPropertyValue('--pop-scale')) || 1;
    var POP_W = 780 * POP_SCALE;                          /* 舞台px:弹窗整体外框宽(含尖角) */
    var showT = 0, hideT = 0, active = null;
    function place(meter) {
      var s = window.innerHeight / 2025, r = meter.getBoundingClientRect();
      var w = POP_W * s, h = popHStage * POP_SCALE * s;   /* 高随内容自适应(fitPopHeight 实测) */
      var x = window.innerWidth - TIP_TO_RIGHT * s - w;
      var y = r.top + r.height / 2 - h / 2;
      var yMax = window.innerHeight - h - 6;
      if (y < 6) y = 6; else if (y > yMax) y = yMax;
      pop.style.setProperty('--u', s + 'px');
      pop.style.left = x.toFixed(1) + 'px';
      pop.style.top = y.toFixed(1) + 'px';
    }
    function show(meter) {
      clearTimeout(hideT);
      active = meter;
      /* v0.6.0 四分发:按 meter 的 data-od-id 渲染对应弹框内容 */
      var kind = String(meter.getAttribute('data-od-id') || '').replace(/^meter-/, '');
      if (POP_TITLES[kind]) renderPop(kind);
      if (pop.classList.contains('on')) { place(meter); butlerShapeDirty(); return; }  /* 环间滑动不重播,矩形随动重报 */
      clearTimeout(showT);
      showT = setTimeout(function () {
        place(meter);
        pop.classList.add('on');
        pop.setAttribute('aria-hidden', 'false');
        butlerShapeDirty();   /* v0.6.2:弹窗显形 → 矩形并入掩码(刷新按钮可点的前提) */
      }, 90);
    }
    function hide() {
      active = null;
      clearTimeout(showT);
      clearTimeout(hideT);
      hideT = setTimeout(function () {
        if (!FORCE_POP_FOR_PREVIEW && !/[?&]pop=/.test(location.search) && !/pop/.test(location.hash)) {
          pop.classList.remove('on');
          pop.setAttribute('aria-hidden', 'true');
          butlerShapeDirty();   /* v0.6.2:弹窗隐形 → 矩形退出掩码,区域回穿透 */
        }
      }, 70);
    }
    meters.forEach(function (m) {
      /* 判定范围 = 整个圆:环本体 + 环内 5h/mcp 字样 + 下方百分比均不丢焦 */
      m.addEventListener('mouseenter', function () { show(m); });
      m.addEventListener('mouseleave', hide);
    });
    /* v0.6.2:指针移进弹窗本体 = 保活(刷新按钮可达);离开弹窗且 70ms 内未回环 → 收起 */
    pop.addEventListener('mouseenter', function () { clearTimeout(hideT); });
    pop.addEventListener('mouseleave', hide);
    window.addEventListener('resize', function () {
      if (active || FORCE_POP_FOR_PREVIEW) place(active || meters[0]);
    }, { passive: true });
    var popQ = (location.search.match(/[?&]pop=([a-z0-9]+)/) || [])[1];
    if (FORCE_POP_FOR_PREVIEW || popQ || /[?&]pop=1/.test(location.search) || /pop/.test(location.hash)) {
      var kind0 = POP_TITLES[popQ] ? popQ : '5h';
      var meter0 = document.querySelector('[data-od-id="meter-' + kind0 + '"]') || meters[0];
      active = meter0;   /* 预览常显时记为活动环:resize 重定位走 place 分支 */
      requestAnimationFrame(function () { renderPop(kind0); place(meter0); pop.classList.add('on'); butlerShapeDirty(); });
    }
  })();

  /* ── 弹窗头部 logo 初始绘制:v0.6.6 起四弹框统一 BigModel 菱形标
     (打开任一弹框时 renderPop 亦按 kind 重绘同一内容,此处只管静态骨架首帧) ── */
  renderBigModelLogo();

  /* ── 数据桥:宿主(WebView2 壳)PostWebMessageAsJson → 四环 + Key + 弹框内容 ──
      协议 = status.mjs --json:account.fiveHour/weekly/mcpMonthly.pct + 弹框明细三字段
      (dayUsage / modelsToday / modelsWeek,v0.6.0)+ keys[](pct 降序)。
      浏览器直开(无宿主)默认空态,调 UI 加 ?demo=1 应用示例值。 */
  var RING_C = 2 * Math.PI * 61;   /* 383.27,与参考图一致 */
  function butlerSetRing(odId, pct, hasData) {
    var meter = document.querySelector('[data-od-id="meter-' + odId + '"]');
    if (!meter) return;
    var arc = meter.querySelector('.ring-arc');
    var pctEl = meter.querySelector('.pct');
    if (!hasData || pct == null) {
      arc.setAttribute('stroke-dasharray', '0 ' + RING_C.toFixed(1));
      arc.setAttribute('stroke', 'var(--label)');
      pctEl.textContent = '—';
      return;
    }
    var p = Math.max(0, Math.min(100, Number(pct) || 0));
    /* 四环水位色统一看已用额度(v0.6.3 用户定档):<30 绿 / 30–60 黄 / 60–90 橙 / ≥90 红 */
    arc.setAttribute('stroke', p < 30 ? 'var(--ring-ok)' :
      p < 60 ? 'var(--ring-warn)' : p < 90 ? 'var(--ring-mid)' : 'var(--ring-low)');
    arc.setAttribute('stroke-dasharray',
      (RING_C * p / 100).toFixed(1) + ' ' + (RING_C * (1 - p / 100)).toFixed(1));
    pctEl.textContent = Math.round(p) + '%';
  }
  function butlerApply(d) {
    if (!d) return;
    butlerData = d;   /* 弹框四分发数据源(整包留存,renderPop 按 kind 取段) */
    var a = d.account || {};
    butlerSetRing('5h',  a.fiveHour    ? a.fiveHour.pct    : null, !!a.fiveHour);
    butlerSetRing('7d',  a.weekly      ? a.weekly.pct      : null, !!a.weekly);
    butlerSetRing('mcp', a.mcpMonthly  ? a.mcpMonthly.pct  : null, !!a.mcpMonthly);
    /* Key 环 = 用量最高那把(pct 降序取第 1);未配置 Key 显示 — */
    var keys = (d.keys || []).filter(function (k) { return k.status !== 'error'; });
    var top = keys.length ? keys[0] : null;
    butlerSetRing('key', top ? top.pct : null, !!top);
    /* 悬停中的弹窗随新数据即时刷新(refresh 周期 110min,常态无感);
       新数据到达同时复位临时刷新按钮 */
    var pop = document.getElementById('usagePop');
    if (pop && pop.classList.contains('on') && popKind) renderPop(popKind);
    if (window.butlerPopRefreshDone) window.butlerPopRefreshDone();
  }
  /* ?key=NN:强制 Key 环用量预览(三档水位色核验用;宿主 file:// 无查询串,不受影响) */
  (function () {
    var m = location.search.match(/[?&]key=(\d+(?:\.\d+)?)/);
    if (m) butlerSetRing('key', parseFloat(m[1]), true);
  })();
  /* 首帧数据来源(v0.2.2):?demo=1 → 四环 + 四弹框全量示例(调 UI 用);否则 localStorage 快照
     (上次宿主推送的真值)→ 冷启动首帧即真实值,消灭「设计稿 73% 闪一下才变正常」;
     两者皆无 → 保持静态空态(—)。真值到达后覆盖并回写快照。 */
  (function () {
    if (location.search.match(/[?&]demo=1/)) {
      var now = Date.now();
      butlerApply({
        fetchedAt: new Date(now).toISOString(),
        account: {
          fiveHour: { pct: 73, used: 0, limit: 0, resetAt: now + 2.6 * 3600000, status: 'ok' },
          weekly: { pct: 66, used: 0, limit: 0, resetAt: now + 5.5 * 86400000, status: 'ok' },
          mcpMonthly: { pct: 52, used: 520, limit: 1000, resetAt: now + 26 * 86400000, status: 'ok',
            tools: { webSearch: 412, webReader: 36, zread: 72 } },
          peakNow: true,
          level: 'PRO',
          dayUsage: {
            total: { calls: 695, tokens: 146582481 },
            peak: { calls: 122, tokens: 23002123 },
            offPeak: { calls: 573, tokens: 123580358 },
          },
          modelsToday: [
            { name: 'GLM-5.3', tokens: 145822480 },
            { name: 'GLM-5.3-FlashX', tokens: 626009 },
            { name: 'GLM-5.3-Flash', tokens: 133992 },
          ],
          modelsWeek: [
            { name: 'GLM-5.3', tokens: 542852632 },
            { name: 'GLM-5.3-FlashX', tokens: 253745005 },
            { name: 'GLM-5.3-Flash', tokens: 23035795 },
          ],
          weekUsage: { calls: 3263, tokens: 750122453 },
        },
        keys: [
          { name: 'key-1', tail: '····jb58', tier: 'PRO', provider: 'bigmodel', pct: 50,
            used: 870000000, quota: 1750000000, peak: 610000000, offpeak: 260000000,
            resetDate: '2026-10-01', status: 'ok' },
          { name: 'key-2', tail: '····kJqT', tier: 'PRO', provider: 'bigmodel', pct: 0,
            used: 0, quota: 1750000000, peak: 0, offpeak: 0,
            resetDate: '2026-10-01', status: 'ok' },
          { name: '海外备', tail: '····Zz9', tier: 'MAX', provider: 'zai', pct: 27,
            used: 480000000, quota: 1750000000, peak: 120000000, offpeak: 360000000,
            resetDate: '2026-10-01', status: 'ok' },
        ],
      });
      return;
    }
    try {
      var snap = localStorage.getItem('butler-last-data');
      if (snap) butlerApply(JSON.parse(snap));
    } catch (err) { }
  })();
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', function (e) {
      try {
        var msg = e.data;
        if (msg && msg.type === 'data') {
          butlerApply(msg.payload);
          try { localStorage.setItem('butler-last-data', JSON.stringify(msg.payload)); } catch (err) { }
        } else if (msg && msg.type === 'notify' && msg.payload) {
          /* 活动提醒入队:收起态眼镜弹徽标;展开态静默积累,收起时补弹 */
          butlerNotify(msg.payload.title || '活动提醒', msg.payload.body || '');
        }
      } catch (err) { }
    });
    window.chrome.webview.postMessage('{"type":"ready"}');
    /* v0.4.9:拖动桥已移除(用户拍板:面板位置固定于 1/3 锚定,不可拖)——
       页 ↔ 宿主收窄为数据(ready/data)+ 形状上报(shape)两桥;宿主侧
       DragMove/drag 路由同删,胶囊区点击落在页面无处理器,静默吞掉 */
    /* 形状上报:布局落定后把面板轮廓/fab 圆映射到视口坐标发给宿主,
       供宿主 WM_NCHITTEST 命中掩码使用(合成宿主下渲染与命中分离,边缘 AA 保真) */
    function butlerReportShape() {
      var stage = document.querySelector('.stage');
      var panel = document.getElementById('panelPath');
      if (!stage || !panel) return;
      var sr = stage.getBoundingClientRect();
      var kx = sr.width / 430, ky = sr.height / 2025;
      /* v0.5.0:收起态 panel-wrap 带水平位移(transform),掩码采样须叠加
         该位移——收起后胶囊 X 全部滑出窗外(点击穿透),Y 量程不变
         (宿主 CapsuleExtent 只读 Y,1/3 锚定零跳动) */
      var pwrap = document.getElementById('panelWrap');
      var wrapTf = pwrap ? getComputedStyle(pwrap).transform : 'none';
      var wrapDx = 0;
      if (wrapTf && wrapTf !== 'none') {
        try { wrapDx = new DOMMatrixReadOnly(wrapTf).e * kx; } catch (err) { }
      }
      /* 胶囊轮廓:沿实际渲染的平滑路径每 4 舞台px 重采样(非 250 点折线)——
         rgn 紧贴曲线,高对比背景下边缘台阶最小化 */
      var PL = panel.getTotalLength(), caps = [], d, pp;
      for (d = 0; d <= PL; d += 4) {
        pp = panel.getPointAtLength(d);
        caps.push([sr.left + pp.x * kx + wrapDx, sr.top + pp.y * ky]);
      }
      /* 两桥铁律(v0.4.9 起拖动桥移除):桥内零设计坐标常量——fab 视口映射(.fab rect+viewBox)、
         描边宽(computed style)、命中圆(.fab-zone rect)全部运行时实测,
         挪动/缩放 fab 或改描宽后掩码自动跟随,合入无需回填锚点 */
      var band = null, arcCaps = null, bandR = 0, fabC = null, fabR = 0;
      var arc = document.getElementById('arcPath');
      if (arc && arc.getTotalLength) {
        var L = arc.getTotalLength();
        if (L > 0) {
          var fabBox = document.querySelector('.fab'),
              fbR = fabBox ? fabBox.getBoundingClientRect() : null,
              fvb = (arc.ownerSVGElement && arc.ownerSVGElement.viewBox) ? arc.ownerSVGElement.viewBox.baseVal : null,
              fu = (fbR && fvb && fvb.width) ? fbR.width / fvb.width : 1;
          var mapF = function (v) {
            return fbR ? [fbR.left + v[0] * fu, fbR.top + v[1] * fu] : [v[0], v[1]];
          };
          var sw = parseFloat(getComputedStyle(arc).strokeWidth) || 0;
          var half = sw / 2 + 2.5, outer = [], inner = [], i, t, p, q, dx, dy, ln, nx, ny;
          for (i = 0; i <= 64; i++) {
            t = L * i / 64;
            p = arc.getPointAtLength(t);
            q = arc.getPointAtLength(Math.min(L, t + 0.5));
            dx = q.x - p.x; dy = q.y - p.y; ln = Math.hypot(dx, dy) || 1;
            nx = -dy / ln; ny = dx / ln;
            outer.push([p.x + nx * half, p.y + ny * half]);
            inner.push([p.x - nx * half, p.y - ny * half]);
          }
          var p0 = arc.getPointAtLength(0), p1 = arc.getPointAtLength(L);
          band = outer.concat(inner.reverse()).map(mapF);
          arcCaps = [mapF([p0.x, p0.y]), mapF([p1.x, p1.y])];
          bandR = half * fu;
          var fabZone = document.querySelector('.fab-zone');
          if (fabZone) {
            var fz = fabZone.getBoundingClientRect();
            fabC = [(fz.left + fz.right) / 2, (fz.top + fz.bottom) / 2];
            fabR = Math.min(fz.width, fz.height) / 2;
          }
        }
      }
      /* 通知卡(提案 D)显示时把卡片矩形并入形状上报:宿主据此扩命中掩码,
         卡上「知道了/稍后」才可点;隐藏时上报 null,区域回到穿透。
         (宿主 ps1 需把 toast 字段并入 HRGN——本轮为原型侧先行) */
      var toastEl = document.getElementById('toastCard');
      var toastRect = null;
      if (toastEl && toastEl.classList.contains('on')) {
        var tr = toastEl.getBoundingClientRect();
        toastRect = [tr.left, tr.top, tr.right, tr.bottom];
      }
      /* v0.6.2 环详情弹窗显形时把弹窗矩形并入形状上报(临时件,随刷新按钮生灭):
         宿主开命中 → 弹窗内刷新按钮可点、指针入窗保活;隐藏上报 null 回穿透 */
      var popEl = document.getElementById('usagePop');
      var popRect = null;
      if (popEl && popEl.classList.contains('on')) {
        var pr = popEl.getBoundingClientRect();
        popRect = [pr.left, pr.top, pr.right, pr.bottom];
      }
      try {
        var pb = panel.getBoundingClientRect(), ab = arc ? arc.getBoundingClientRect() : null;
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'shape', dpr: (window.devicePixelRatio || 1),
          capsule: caps, band: band, caps: arcCaps, bandR: bandR, fabC: fabC, fabR: fabR,
          toast: toastRect,
          pop: popRect,
          dbgPanelBox: [pb.left, pb.top, pb.right, pb.bottom],
          dbgArcBox: ab ? [ab.left, ab.top, ab.right, ab.bottom] : null,
          dbgBodyBg: getComputedStyle(document.body).backgroundColor,
          dbgDiscFill: (function () { try { return getComputedStyle(document.querySelector('.fab .disc circle')).fill; } catch (e) { return 'n/a'; } })(),
          dbgHit: (function () { try { return getComputedStyle(document.querySelector('.fab-hit')).backgroundColor; } catch (e) { return 'n/a'; } })()
        }));
      } catch (err) { }
    }
    if (document.readyState === 'complete') { requestAnimationFrame(butlerReportShape); }
    else { window.addEventListener('load', function () { requestAnimationFrame(butlerReportShape); }); }
    /* 展开/收起动画落定后重报形状:掩码 X 跟随面板进出(收起后穿透、展开后可拖),
       Y 量程不变故宿主锚定不动;打断反转时只在最终态报一次(transitionend 语义) */
    var pwrapForShape = document.getElementById('panelWrap');
    if (pwrapForShape) {
      pwrapForShape.addEventListener('transitionend', function (e) {
        if (e.target === pwrapForShape && e.propertyName === 'transform') butlerReportShape();
      });
    }
    /* 通知卡进出后重报形状:transitionend 精确报在落定帧,
       butler-shape-dirty 定时兜底(覆盖 reduced-motion 无过渡事件的场景) */
    var toastForShape = document.getElementById('toastCard');
    if (toastForShape) {
      toastForShape.addEventListener('transitionend', function (e) {
        if (e.target === toastForShape && e.propertyName === 'transform') butlerReportShape();
      });
    }
    window.addEventListener('butler-shape-dirty', function () {
      setTimeout(butlerReportShape, 520);
    });
  }
</script>
